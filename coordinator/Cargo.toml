[package]
name = "solana-edge-coordinator"
version = "0.1.0"
edition = "2021"
default-run = "solana-edge-coordinator"

[dependencies]
anyhow = "1"
axum = "0.8"
ed25519-dalek = "2"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-edge-miner-core = { path = "../miner/core" }
solana-edge-protocol = { path = "../shared/protocol" }
solana-edge-rpc = { path = "../shared/rpc" }
solana-edge-verifier = { path = "../verifier" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
