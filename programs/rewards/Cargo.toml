[package]
name = "solana-edge-rewards"
version = "0.1.0"
description = "Devnet reward settlement program for Solana Edge"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_edge_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token"] }
