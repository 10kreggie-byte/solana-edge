name: Fund Devnet Deployer

on:
  workflow_dispatch:
    inputs:
      target_lamports:
        description: "Devnet lamports to mine (100000000 = 0.1 SOL)"
        required: true
        default: "100000000"
        type: string

permissions:
  contents: read

jobs:
  fund:
    runs-on: ubuntu-latest
    environment: devnet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.79.0"

      - name: Validate requested amount
        env:
          TARGET_LAMPORTS: ${{ inputs.target_lamports }}
        run: |
          set -euo pipefail
          [[ "$TARGET_LAMPORTS" =~ ^[0-9]+$ ]]
          test "$TARGET_LAMPORTS" -ge 1
          test "$TARGET_LAMPORTS" -le 1000000000

      - name: Install Devnet PoW faucet client
        run: cargo install devnet-pow --version 0.1.4 --locked

      - name: Materialize dedicated Devnet deployer
        env:
          DEPLOYER_JSON: ${{ secrets.SOLANA_DEVNET_DEPLOYER_KEYPAIR_JSON }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_JSON"
          printf '%s\n' "$DEPLOYER_JSON" > "$RUNNER_TEMP/devnet-deployer.json"
          chmod 600 "$RUNNER_TEMP/devnet-deployer.json"

      - name: Mine Devnet SOL
        env:
          TARGET_LAMPORTS: ${{ inputs.target_lamports }}
          DEPLOYER_PUBKEY: 2z1FZKaE42QjeZzEiB3pnPrAqtq5Xrr62t2BccfqThau
        run: |
          set -euo pipefail

          get_balance() {
            PAYLOAD="$(printf '{"jsonrpc":"2.0","id":1,"method":"getBalance","params":["%s",{"commitment":"confirmed"}]}' "$DEPLOYER_PUBKEY")"
            RESPONSE="$(curl -fsS https://api.devnet.solana.com \
              -H 'content-type: application/json' \
              --data "$PAYLOAD")"
            printf '%s' "$RESPONSE" | python3 -c 'import json,sys; o=json.load(sys.stdin); r=o.get("result"); print(r["value"]) if r is not None else (print("Devnet RPC error:", o, file=sys.stderr), sys.exit(1))'
          }

          BEFORE="$(get_balance)"
          echo "Deployer balance before bootstrap: $BEFORE lamports"

          if [ "$BEFORE" -lt 5000 ]; then
            AIRDROP_PAYLOAD="$(printf '{"jsonrpc":"2.0","id":2,"method":"requestAirdrop","params":["%s",1000000,{"commitment":"confirmed"}]}' "$DEPLOYER_PUBKEY")"
            AIRDROP_RESPONSE="$(curl -fsS https://api.devnet.solana.com \
              -H 'content-type: application/json' \
              --data "$AIRDROP_PAYLOAD")"
            AIRDROP_SIG="$(printf '%s' "$AIRDROP_RESPONSE" | python3 -c 'import json,sys; o=json.load(sys.stdin); r=o.get("result"); print(r) if r is not None else (print("Devnet bootstrap airdrop error:", o, file=sys.stderr), sys.exit(1))')"
            echo "Requested 0.001 SOL fee bootstrap: $AIRDROP_SIG"

            BOOTSTRAP_BALANCE=0
            for _ in $(seq 1 12); do
              sleep 5
              BOOTSTRAP_BALANCE="$(get_balance)"
              if [ "$BOOTSTRAP_BALANCE" -ge 5000 ]; then
                break
              fi
            done

            if [ "$BOOTSTRAP_BALANCE" -lt 5000 ]; then
              echo "Fee bootstrap did not arrive; cannot pay PoW claim transaction fees." >&2
              exit 1
            fi
          fi

          MINING_BEFORE="$(get_balance)"
          echo "Deployer balance before PoW mining: $MINING_BEFORE lamports"

          set +e
          OUTPUT="$(devnet-pow \
            -k "$RUNNER_TEMP/devnet-deployer.json" \
            -u dev \
            mine \
            -d 3 \
            --reward 0.02 \
            --no-infer \
            --target-lamports "$TARGET_LAMPORTS" 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          test "$STATUS" -eq 0

          AFTER="$(get_balance)"
          DELTA=$((AFTER - MINING_BEFORE))
          MIN_REQUIRED=$((TARGET_LAMPORTS * 95 / 100))
          echo "Deployer balance after PoW mining: $AFTER lamports"
          echo "PoW funding delta: $DELTA lamports"

          if [ "$DELTA" -lt "$MIN_REQUIRED" ]; then
            echo "PoW funding did not reach at least 95% of the requested target." >&2
            exit 1
          fi

      - name: Remove temporary key material
        if: always()
        run: rm -f "$RUNNER_TEMP/devnet-deployer.json"
