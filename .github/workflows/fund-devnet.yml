name: Fund Devnet Deployer

on:
  workflow_dispatch:
    inputs:
      target_lamports:
        description: "Devnet lamports to mine (100000000 = 0.1 SOL)"
        required: true
        default: "100000000"
        type: string

permissions:
  contents: read

jobs:
  fund:
    runs-on: ubuntu-latest
    environment: devnet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.79.0"

      - name: Validate requested amount
        env:
          TARGET_LAMPORTS: ${{ inputs.target_lamports }}
        run: |
          set -euo pipefail
          [[ "$TARGET_LAMPORTS" =~ ^[0-9]+$ ]]
          test "$TARGET_LAMPORTS" -ge 1
          test "$TARGET_LAMPORTS" -le 1000000000

      - name: Install Devnet PoW faucet client
        run: cargo install devnet-pow --version 0.1.4 --locked

      - name: Materialize dedicated Devnet deployer
        env:
          DEPLOYER_JSON: ${{ secrets.SOLANA_DEVNET_DEPLOYER_KEYPAIR_JSON }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_JSON"
          printf '%s\n' "$DEPLOYER_JSON" > "$RUNNER_TEMP/devnet-deployer.json"
          chmod 600 "$RUNNER_TEMP/devnet-deployer.json"

      - name: Mine Devnet SOL
        env:
          TARGET_LAMPORTS: ${{ inputs.target_lamports }}
          DEPLOYER_PUBKEY: 2z1FZKaE42QjeZzEiB3pnPrAqtq5Xrr62t2BccfqThau
        run: |
          set -euo pipefail

          get_balance() {
            curl -fsS https://api.devnet.solana.com \
              -H 'content-type: application/json' \
              --data "{"jsonrpc":"2.0","id":1,"method":"getBalance","params":["$DEPLOYER_PUBKEY",{"commitment":"confirmed"}]}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["value"])'
          }

          BEFORE="$(get_balance)"
          echo "Deployer balance before: $BEFORE lamports"

          set +e
          OUTPUT="$(devnet-pow \
            -k "$RUNNER_TEMP/devnet-deployer.json" \
            -u dev \
            mine \
            -d 3 \
            --reward 0.02 \
            --no-infer \
            --target-lamports "$TARGET_LAMPORTS" 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          test "$STATUS" -eq 0

          AFTER="$(get_balance)"
          echo "Deployer balance after: $AFTER lamports"

          if [ "$AFTER" -le "$BEFORE" ]; then
            echo "Funding did not increase the deployer balance." >&2
            exit 1
          fi

      - name: Remove temporary key material
        if: always()
        run: rm -f "$RUNNER_TEMP/devnet-deployer.json"
